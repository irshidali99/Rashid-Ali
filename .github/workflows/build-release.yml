name: Build release APK

# Builds installable debug APK + unsigned release APK/AAB on GitHub runners
# (which have the full Android SDK), then commits them to builds/ on this branch.
on:
  workflow_dispatch:
  push:
    branches: ["arena/01a0e65f-rashid-ali"]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.kts"
      - "*.properties"
      - ".github/workflows/**"

# Needed so the job can commit built APKs / diagnostics back to the branch.
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          which sdkmanager || ls "$ANDROID_HOME/cmdline-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list_installed 2>/dev/null | tail -n 25 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK (installable, debug-signed)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee gradle-debug.log

      - name: Build release APK + AAB (unsigned, no upload key in CI)
        run: |
          set -o pipefail
          gradle :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee gradle-release.log

      - name: Collect outputs
        run: |
          mkdir -p builds
          cp app/build/outputs/apk/debug/app-debug.apk builds/duplicate-remover-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk builds/duplicate-remover-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab builds/duplicate-remover-release.aab
          ls -lh builds/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-remover-apks
          path: builds/
          retention-days: 30

      - name: Commit APKs back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/
          if git diff --staged --quiet; then
            echo "No APK changes to commit."
            exit 0
          fi
          git commit -m "CI build: debug + release APK/AAB [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Commit diagnostics on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p builds
          { echo "===== debug ====="; tail -c 150000 gradle-debug.log 2>/dev/null; echo; echo "===== release ====="; tail -c 150000 gradle-release.log 2>/dev/null; } > builds/last-build-error.log
          git add builds/last-build-error.log
          git commit -m "CI: build failure diagnostics [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
