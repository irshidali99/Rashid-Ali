name: Build release APK

# Builds installable debug APK + unsigned release APK/AAB on GitHub runners
# (which have the full Android SDK), then commits them to builds/ on this branch.
on:
  workflow_dispatch:
  push:
    branches: ["arena/01a0e65f-rashid-ali"]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.kts"
      - "*.properties"
      - ".github/workflows/**"

# Needed so the job can commit built APKs / diagnostics back to the branch.
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          which sdkmanager || ls "$ANDROID_HOME/cmdline-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list_installed 2>/dev/null | tail -n 25 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK (installable, debug-signed)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee gradle-debug.log

      - name: Build release APK + AAB (unsigned, no upload key in CI)
        run: |
          set -o pipefail
          gradle :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee gradle-release.log

      - name: Collect outputs
        run: |
          mkdir -p builds
          cp app/build/outputs/apk/debug/app-debug.apk builds/duplicate-remover-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk builds/duplicate-remover-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab builds/duplicate-remover-release.aab
          ls -lh builds/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-remover-apks
          path: builds/
          retention-days: 30

      - name: Commit APKs back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/
          if git diff --staged --quiet; then
            echo "No APK changes to commit."
            exit 0
          fi
          git commit -m "CI build: debug + release APK/AAB [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report build errors as annotations
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import re
          for name in ['gradle-debug.log', 'gradle-release.log']:
              try:
                  txt = open(name, encoding='utf-8', errors='replace').read()
              except FileNotFoundError:
                  print(f"::notice title={name}::log file missing (step did not run)")
                  continue
              chunks = []
              for m in re.finditer(r'What went wrong:(.*?)(?:\* Try:|\Z)', txt, re.S):
                  chunks.append(m.group(1).strip())
              for line in txt.splitlines():
                  s = line.strip()
                  if re.search(r'FAILED|Execution failed|error:|e: file|Could not|not found', s):
                      chunks.append(s)
              seen, out = set(), []
              for c in chunks:
                  c = re.sub(r'\s+', ' ', c)[:800]
                  if len(c) > 10 and c not in seen:
                      seen.add(c)
                      out.append(c)
              if not out:
                  tail = ' | '.join(txt.splitlines()[-4:])
                  out = ['no clear error match; tail: ' + re.sub(r'\s+', ' ', tail)[:800]]
              for i, c in enumerate(out[:12]):
                  c = c.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f"::error title={name}#{i+1}::{c}")
          PYEOF
